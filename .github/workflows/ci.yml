name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by hand for the Phase 4 stability runs (and any later re-check of main).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run. Each dispatched run gets its own group,
  # so several stability runs can queue side by side without cancelling each other.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static (typecheck, unit, contract, oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: |
          npm ci
          pip install gherkin-official==42.0.1

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm run test:unit

      - name: Expected-value oracle
        run: npm run check:oracle

  surface:
    # Each surface builds what it needs and runs in parallel with the others (DR-006 reach per folder).
    name: Surface (${{ matrix.surface }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        surface: [core, api, angular, nextjs]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        if: matrix.surface == 'angular' || matrix.surface == 'nextjs'
        run: npx playwright install --with-deps chromium

      - name: Run the ${{ matrix.surface }} surface
        run: npm run test:${{ matrix.surface }}
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload Cucumber messages and set-up timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ matrix.surface }}
          path: test-harnesses/harness-serenity/reports/
          if-no-files-found: error

      - name: Upload Serenity/JS JSON for the HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: serenity-${{ matrix.surface }}
          path: test-harnesses/harness-serenity/target/site/serenity/
          if-no-files-found: error

  parity:
    # Fan-in: the gate compares all four surfaces' reports, so it runs once they have all finished.
    name: Parity gate and measured timings
    needs: [static, surface]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Collect every surface's reports
        uses: actions/download-artifact@v7
        with:
          pattern: reports-*
          merge-multiple: true
          path: test-harnesses/harness-serenity/reports/

      - name: Parity gate
        run: npm run check:parity

      - name: Measured timings
        if: always()
        run: npm run report:timings

      - name: Upload timings summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: timings-summary
          path: test-harnesses/harness-serenity/reports/timings-summary.json
          if-no-files-found: ignore

  report:
    # Serenity BDD HTML report per surface plus an index page (tools/build-reports.mjs). Built on
    # every run so a pull request proves it still builds; published only from main (deploy job).
    name: Serenity BDD HTML reports
    needs: [surface]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Collect every surface's Serenity/JS JSON
        uses: actions/download-artifact@v7
        with:
          pattern: serenity-*
          merge-multiple: true
          path: test-harnesses/harness-serenity/target/site/serenity/

      - name: Collect every surface's Cucumber messages
        uses: actions/download-artifact@v7
        with:
          pattern: reports-*
          merge-multiple: true
          path: test-harnesses/harness-serenity/reports/

      - name: Build the HTML reports
        run: npm run report:html

      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: test-harnesses/harness-serenity/target/site/report/

  deploy:
    # Publishes only a run whose parity gate and report both passed, so the public page never shows
    # a red build as the project's evidence.
    name: Publish reports to GitHub Pages
    needs: [parity, report]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.parity.result == 'success' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
